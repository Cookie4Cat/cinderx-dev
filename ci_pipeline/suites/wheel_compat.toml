fail_fast = false

[target]
python = "3.14"
arch = "arm64"
system = "Linux"

[[jobs]]
name = "setup_wheel"
command = '''
set -eo pipefail
if [ -z "$CINDERX_TEST_WHEEL" ]; then
  echo "CINDERX_TEST_WHEEL must point to the cinderx wheel to test" >&2
  exit 2
fi
test -f "$CINDERX_TEST_WHEEL"
rm -rf "{run_dir}/venv"
"$CINDERX_TEST_PYTHON" -m venv "{run_dir}/venv"
"{run_dir}/venv/bin/python" -m pip install --upgrade pip pytest
"{run_dir}/venv/bin/python" -m pip install --force-reinstall "$CINDERX_TEST_WHEEL"
"{run_dir}/venv/bin/python" - <<'PY'
import _cinderx
import cinderx

print("cinderx initialized:", cinderx.is_initialized())
print("_cinderx:", _cinderx.__file__)
PY
'''

[[jobs]]
name = "test_cinderx_wheel"
# The selected runner suites filter out optional xxclassloader coverage,
# strict compiler stub package data, and the compiler SBS stdlib corpus.
command = "\"{run_dir}/venv/bin/python\" cinderx/TestScripts/TestScriptsKunpeng/test_cinderx_runner.py --python \"{run_dir}/venv/bin/python\" --suite all_test_cinderx --suite test_static_tests --suite test_compiler --suite test_cpython_overrides --suite test_coro_extensions --suite test_jit_attr_cache --suite test_parallel_gc --suite test_perf_profiler_precompile --suite test_type_cache --suite test_jit_support_instrumentation --suite test_frame_evaluator_clean_slate --log-dir \"{run_dir}/logs/test_cinderx_wheel\" --json-summary-file \"{run_dir}/test_cinderx_wheel.json\""

[[jobs]]
name = "lib_test_adaptive_aware_24"
command = "\"{run_dir}/venv/bin/python\" cinderx/TestScripts/TestScriptsKunpeng/lib_test_runner.py --mode frame-eval-adaptive-aware --adaptive-compile-after 24 --runner dispatcher --num-workers auto --worker-timeout 1200 --worker-respawn-interval 10 --test-list-file \"{run_dir}/lib_test_adaptive_aware_24_tests.txt\" --json-summary-file \"{run_dir}/lib_test_adaptive_aware_24.json\""

[[jobs]]
name = "lib_test_official_skip_ok_26"
command = "\"{run_dir}/venv/bin/python\" cinderx/TestScripts/TestScriptsKunpeng/lib_test_runner.py --mode frame-eval-adaptive-aware --adaptive-compile-after 24 --runner dispatcher --num-workers auto --worker-timeout 1200 --worker-respawn-interval 1 --test-from-file cinderx/TestScripts/TestScriptsKunpeng/lib_test_daily_official_skip_ok_26.txt --include-skipped-modules --test-list-file \"{run_dir}/lib_test_official_skip_ok_26_tests.txt\" --json-summary-file \"{run_dir}/lib_test_official_skip_ok_26.json\""
