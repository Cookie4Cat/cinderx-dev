# 3.11 libtest 配置③（JIT-on 差分，双阈值；设计书 §4.3，daily 层）。
# 清单：cinderx/TestScripts/TestScriptsKunpeng/lib_test_311_jit_on.txt。
# 复用 cinderx_local_311 的 venv 约定（setup_release 先行）。
fail_fast = false

[target]
python = "3.11"
arch = "arm64"
system = "Linux"

[[jobs]]
name = "setup_release"
command = "mkdir -p \"{run_dir}/wheelhouse\" && \"$CINDERX_TEST_PYTHON\" -m pip wheel --no-build-isolation --no-deps -w \"{run_dir}/wheelhouse\" . && rm -rf \"{run_dir}/venv\" && \"$CINDERX_TEST_PYTHON\" -m venv \"{run_dir}/venv\" && \"{run_dir}/venv/bin/python\" -m pip install --upgrade pip && \"{run_dir}/venv/bin/python\" -m pip install --no-index --find-links=\"{run_dir}/wheelhouse\" cinderx"
[jobs.env]
CINDERX_INCLUDE_TEST_PACKAGE_DATA = "1"
ENABLE_LIGHTWEIGHT_FRAMES = "1"

[[jobs]]
name = "lib_test_jit_on_t2"
command = "\"{run_dir}/venv/bin/python\" cinderx/TestScripts/TestScriptsKunpeng/lib_test_runner.py --mode frame-eval-adaptive-aware --adaptive-compile-after 2 --runner dispatcher --num-workers auto --worker-timeout 1200 --worker-respawn-interval 10 --test-from-file cinderx/TestScripts/TestScriptsKunpeng/lib_test_311_jit_on.txt --include-skipped-modules --test-list-file \"{run_dir}/lib_test_311_t2_tests.txt\" --json-summary-file \"{run_dir}/lib_test_311_t2.json\""

[[jobs]]
name = "lib_test_jit_on_t24"
command = "\"{run_dir}/venv/bin/python\" cinderx/TestScripts/TestScriptsKunpeng/lib_test_runner.py --mode frame-eval-adaptive-aware --adaptive-compile-after 24 --runner dispatcher --num-workers auto --worker-timeout 1200 --worker-respawn-interval 10 --test-from-file cinderx/TestScripts/TestScriptsKunpeng/lib_test_311_jit_on.txt --include-skipped-modules --test-list-file \"{run_dir}/lib_test_311_t24_tests.txt\" --json-summary-file \"{run_dir}/lib_test_311_t24.json\""
