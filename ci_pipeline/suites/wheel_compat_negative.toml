fail_fast = true

[target]
python = "3.14"
arch = "arm64"
system = "Linux"

[[jobs]]
name = "wheel_compat_negative"
command = "if [ -z \"$CINDERX_TEST_WHEEL\" ]; then echo \"CINDERX_TEST_WHEEL is required\"; exit 2; fi && if [ -z \"$CINDERX_UNSUPPORTED_TEST_PYTHON\" ]; then echo \"CINDERX_UNSUPPORTED_TEST_PYTHON is required\"; exit 2; fi && \"$CINDERX_TEST_PYTHON\" ci_pipeline/wheel_compat_negative.py --python \"$CINDERX_UNSUPPORTED_TEST_PYTHON\" --wheel \"$CINDERX_TEST_WHEEL\" --log-dir \"{run_dir}/logs/wheel_compat_negative\" --json-summary-file \"{run_dir}/wheel_compat_negative.json\""
