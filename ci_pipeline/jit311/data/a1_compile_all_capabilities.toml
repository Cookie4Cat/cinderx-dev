[meta]
version = 1
python = "3.11.6"

# Stable capability decisions.  Compiler failures and transient states not
# listed here remain unexpected and fail the A1 classifier.
[expected_refusal]
reasons = [
  "REFUSE_PATTERN_MATCHING_UNAUDITED",
  "REFUSE_EXCEPT_STAR_UNAUDITED",
  "REFUSE_HELPER_UNAVAILABLE_PRE314",
  "REFUSE_UNPORTED",
  "INTERP_ONLY_ASYNC_CODE",
  "INTERP_ONLY_NON_FUNCTION_SCOPE",
  "INTERP_ONLY_PSEUDO_SLOT",
  "REFUSE_SHAPE_GENERATOR_RUNTIME_UNAUDITED",
  "REFUSE_SHAPE_ASYNC_CODE",
  "REFUSE_SHAPE_NON_FUNCTION_SCOPE",
  "REFUSE_SHAPE_NAMESPACE_UNSUPPORTED",
  "REFUSE_SHAPE_INT_ACCUMULATOR_POLICY",
  "REFUSE_SHAPE_JIT_SUPPRESSED",
  "REFUSE_SHAPE_FRONTEND_POLICY",
  "REFUSE_SHAPE_CODEGEN_SPAN",
  "REFUSE_SHAPE_STATIC_RUNTIME_CACHE",
  "REFUSE_SHAPE_INVALID_UTF8_NAME",
  "REFUSE_SHAPE_EXECUTE_SURFACE",
  "REFUSE_SHAPE_IMPORTLIB_BOOTSTRAP",
  "REFUSE_SHAPE_CINDER_MODULE",
]

[runtime_fallback]
reasons = [
  "TRACING_ACTIVE",
  "PROFILING_ACTIVE",
  "FOREIGN_EVALUATOR",
  "JIT_PAUSED",
]
